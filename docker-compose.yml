services:
  floci:
    image: floci/floci:latest
    container_name: documind-floci

    ports:
      - "127.0.0.1:4566:4566"

    volumes:
      - floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_UI_BIND_ADDRESS: "127.0.0.1"
      FLOCI_SERVICES_SQS_ENDPOINT_STRATEGY: "aws"

    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: documind-backend

    env_file:
      - ./backend/.env

    environment:
      APP_ENV: local
      FLOCI_ENDPOINT: http://floci:4566

      # The token issuer must match the issuer inside the Cognito JWT.
      COGNITO_ISSUER: http://localhost:4566/us-east-1_470968fea
      COGNITO_JWKS_URL: http://floci:4566/us-east-1_470968fea/.well-known/jwks.json

      # OpenSearch and Ollama run outside this Compose project.
      OPENSEARCH_HOST: host.docker.internal
      OLLAMA_BASE_URL: http://host.docker.internal:11434

      HF_HOME: /models/huggingface

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - models-cache:/models

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      floci:
        condition: service_started

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 90s

    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: documind-worker

    command: ["python", "-m", "app.workers.document_worker"]

    env_file:
      - ./backend/.env

    environment:
      APP_ENV: local
      FLOCI_ENDPOINT: http://floci:4566
      COGNITO_ISSUER: http://localhost:4566/us-east-1_470968fea
      COGNITO_JWKS_URL: http://floci:4566/us-east-1_470968fea/.well-known/jwks.json
      OPENSEARCH_HOST: host.docker.internal
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      HF_HOME: /models/huggingface

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - models-cache:/models

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: documind-frontend

    ports:
      - "127.0.0.1:8080:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

volumes:
  floci-data:
  models-cache:
